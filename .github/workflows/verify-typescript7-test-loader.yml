name: Verify TypeScript 7 test loader compatibility

on:
  push:
    branches: ["fix/typescript7-test-loader"]

permissions:
  contents: write

concurrency:
  group: typescript7-test-loader-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install and refresh lockfile
        run: bun install
      - name: Commit refreshed lockfile
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "Update lockfile for TypeScript API compatibility"
            git push
          fi
      - name: Verify frozen installation
        run: bun ci
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Format test loader
        run: bunx biome format --write tests/ts-loader.mjs package.json
      - name: Commit formatting changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/ts-loader.mjs package.json
            git commit -m "Format TypeScript test loader changes"
            git push
          fi
      - name: Run tests (report-only)
        run: bun run test
        continue-on-error: true
