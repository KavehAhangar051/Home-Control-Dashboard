name: Verify TanStack Query update

on:
  push:
    branches: ["chore/tanstack-query-5.107.2"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install and update TanStack Query
        run: bun install && bun update @tanstack/react-query
      - name: Verify lint and TypeScript
        run: bun run lint && bun run typecheck
      - name: Commit lockfile
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): refresh TanStack Query lockfile"
          git push
