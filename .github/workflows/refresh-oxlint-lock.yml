name: Refresh dependency lockfile

on:
  push:
    branches: ["chore/oxlint-1.94.0"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: chore/oxlint-1.94.0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install and refresh lockfile
        run: bun install
      - name: Verify lint and types
        run: bun run lint && bun run typecheck
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): refresh Oxlint lockfile"
            git push
          fi
