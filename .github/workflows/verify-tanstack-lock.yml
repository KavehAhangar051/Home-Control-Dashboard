name: Verify TanStack Query lock consistency

on:
  push:
    branches: ["chore/tanstack-query-5.107.2"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Install frozen lockfile
        run: bun install --frozen-lockfile
      - name: Verify lint and TypeScript
        run: bun run lint && bun run typecheck
