name: Verify dnd-kit migration

on:
  push:
    branches: ["feat/dnd-kit-modern-migration"]

permissions:
  contents: write

concurrency:
  group: dnd-kit-migration-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-dnd-kit-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install and refresh lockfile
        run: bun install
      - name: Commit refreshed lockfile
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "Update lockfile for modern dnd-kit"
            git push
          fi
      - name: Verify frozen installation
        run: bun ci
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bunx biome format --check app components features lib
      - name: Typecheck
        run: bun run typecheck
      - name: Run tests (report-only)
        run: bun run test
        continue-on-error: true
