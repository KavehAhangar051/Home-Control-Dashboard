name: Generate Bun lockfile (temporary)

on:
  push:
    branches: ["opennext-setup"]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: opennext-setup
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Generate lockfile
        run: bun install --lockfile-only
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "Lockfile already up to date"
            exit 0
          fi
          git commit -m "chore: update bun lockfile for OpenNext"
          git push origin HEAD:opennext-setup
