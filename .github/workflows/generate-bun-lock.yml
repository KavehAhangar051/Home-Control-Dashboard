name: Validate OpenNext setup (temporary)

on:
  push:
    branches: ["opennext-setup"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: opennext-setup
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Frozen dependency install
        run: bun install --frozen-lockfile
      - name: OpenNext build
        run: bunx opennextjs-cloudflare build
      - name: Wrangler dry run
        run: bunx wrangler deploy --dry-run
      - name: Project build
        run: bun run build
